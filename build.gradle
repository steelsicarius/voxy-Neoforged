plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

// ---- JarJar (nested plain libraries) ----
// FML supports embedding plain (non-mod) jars under META-INF/jarjar/; the moddev plugin
// creates the `jarJar` configuration and the `jarJar` task that writes the nested jars plus
// their metadata.json into the mod jar. LWJGL resolves its bundled natives through the
// classloader of the binding module's own classes (LibLMDB/LibZstd pass themselves as the
// context class to Library.loadSystem), so nested natives jars are found at runtime.
//
// The catch: both the metadata writer and FML's JarSelector key jars by group:artifact and
// keep only one jar per identifier. The official natives jars share `org.lwjgl:<module>`
// with the main jars, so the natives jars are published in the versioned `natives-repo/`
// directory under unique `me.cortex.vojynatives:<module>-<classifier>` coordinates.
def voxyNativesGroup = 'me.cortex.vojynatives'

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    // Modrinth maven, used for compat mods (sodium, iris, ...) resolved by mod id + version.
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    // Fabric maven: fabric-loader is needed as a compileOnly dependency because the
    // Flashback replay mod's API classes (which Voxy's optional compat references)
    // implement Fabric loader types. It is never used at runtime on NeoForge.
    exclusiveContent {
        forRepository {
            maven {
                name = "FabricMC"
                url = "https://maven.fabricmc.net/"
            }
        }
        filter {
            includeGroup "net.fabricmc"
        }
    }
    // Local repository holding the LWJGL natives jars repackaged under unique coordinates
    // (me.cortex.vojynatives:<module>-<classifier>, see natives-repo/README.md). Only jars
    // are provided - there is deliberately no POM metadata.
    exclusiveContent {
        forRepository {
            maven {
                name = "VoxyNatives"
                url = file('natives-repo')
                metadataSources { artifact() }
            }
        }
        filter {
            includeGroup voxyNativesGroup
        }
    }
    mavenCentral()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Extract the real Sodium mod jar from the jar-in-jar wrapper so javac can see its classes.
// (Fabric port note: the fabric artifact is flat and needs no such handling, but the
// NeoForge distribution of Sodium nests the actual mod inside META-INF/jarjar/.)
def sodiumJijDir = layout.buildDirectory.dir('sodiumJij')
def sodiumModJar = sodiumJijDir.map { it.file('sodium-neoforge-mod.jar') }

def extractSodiumModJar = tasks.register('extractSodiumModJar', Sync) {
    from({
        zipTree(configurations.sodiumJij.singleFile).matching {
            include 'META-INF/jarjar/*.jar'
        }
    })
    into sodiumJijDir
    eachFile { f ->
        // Flatten META-INF/jarjar/<name>.jar into the destination root.
        f.relativePath = new RelativePath(true, 'sodium-neoforge-mod.jar')
    }
}

// File dependency wired to the extraction task so every classpath consumer runs it first.
def sodiumModJarFiles = files(sodiumModJar).builtBy(extractSodiumModJar)

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    // Sodium's NeoForge artifact is a jar-in-jar wrapper: the real classes live in a
    // nested jar under META-INF/jarjar/. This configuration is only used to locate
    // that nested jar at build time (see the extractSodiumModJar task below).
    sodiumJij
}

dependencies {
    // ---- Compat mods (Modrinth maven) ----
    // Sodium is required: Voxy integrates deeply with its renderer.
    // The wrapper jar (with the nested mod jar inside) is what FML loads at runtime;
    // javac compiles against the extracted nested jar (see extractSodiumModJar).
    implementation "maven.modrinth:sodium:${sodium_version_modrinth}"
    sodiumJij "maven.modrinth:sodium:${sodium_version_modrinth}"
    compileOnly sodiumModJarFiles
    // Iris shader support (active when iris is installed at runtime).
    compileOnly "maven.modrinth:iris:${iris_version_modrinth}"
    // GLSL AST patching for Iris shader-pack patches (IrisShaderPatch). Iris bundles
    // glsl-transformer as a jar-in-jar at runtime, so compileOnly is enough here,
    // mirroring upstream's Fabric build.
    compileOnly "io.github.douira:glsl-transformer:3.0.0-pre3"
    // Fabric loader types appear in the signatures of Flashback's API classes; compile
    // only, never packaged or used at runtime on NeoForge (FlashbackCompat checks
    // ModList and bails out when flashback is absent, which it always is here).
    compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
    // Fabric-only compat mods referenced by Voxy's optional integration code.
    // On NeoForge these mods are never installed, the compat paths stay inactive,
    // but the classes must be present to compile against them.
    compileOnly "maven.modrinth:flashback:VaqZB1DF"
    compileOnly "maven.modrinth:nvidium:0.4.4-beta2-26.1"
    compileOnly "maven.modrinth:vivecraft:26.2-1.3.12-fabric"
    compileOnly "maven.modrinth:lithium:mc26.1.2-0.24.6-fabric"

    // ---- Bundled (jarJar) libraries, mirroring the Fabric build ----
    // FML loads jars nested under META-INF/jarjar/ onto the plugin classpath; plain
    // (non-mod) libraries are supported there. MC itself provides slf4j and gson, so
    // those are not embedded. MC 26.1.2 also ships the at.yawk.lz4 fork of lz4-java
    // (same org.lz4 packages) on the launch classpath, so org.lz4:lz4-java is not
    // embedded either.
    implementation 'redis.clients:jedis:5.1.0'
    implementation 'org.rocksdb:rocksdbjni:10.2.1'
    implementation 'org.apache.commons:commons-pool2:2.12.0'
    implementation 'org.tukaani:xz:1.10'
    // The jarJar configuration is non-transitive: jedis' org.json dependency (not
    // provided by MC) is embedded explicitly.
    jarJar 'redis.clients:jedis:5.1.0'
    jarJar 'org.json:json:20231013'
    jarJar 'org.rocksdb:rocksdbjni:10.2.1'
    jarJar 'org.apache.commons:commons-pool2:2.12.0'
    jarJar 'org.tukaani:xz:1.10'
    // sqlite-jdbc stays dev-runtime-only, exactly like the Fabric build: the Distant
    // Horizons importer logs a warning and disables itself when the driver is missing.
    runtimeOnly 'org.xerial:sqlite-jdbc:3.49.1.0'

    // LWJGL bindings not shipped with vanilla MC (LMDB and Zstd storage backends).
    // Both the java bindings and the natives are embedded; LWJGL resolves the natives
    // through the binding class' own classloader, so the nested natives jar is found at
    // runtime. The per-platform natives jars are merged into one jar per module (see
    // natives-repo/README.md): FML identifies nested jars by their manifest
    // Implementation-Title, and LWJGL's official natives jars share it across platforms,
    // so embedding them separately would make FML keep only one platform.
    def lwjgl = '3.4.1' // must match the LWJGL version shipped with MC 26.1.2
    implementation "org.lwjgl:lwjgl-lmdb:${lwjgl}"
    implementation "org.lwjgl:lwjgl-zstd:${lwjgl}"
    jarJar "org.lwjgl:lwjgl-lmdb:${lwjgl}"
    jarJar "org.lwjgl:lwjgl-zstd:${lwjgl}"
    jarJar "me.cortex.vojynatives:lwjgl-lmdb-natives:${lwjgl}"
    jarJar "me.cortex.vojynatives:lwjgl-zstd-natives:${lwjgl}"
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
